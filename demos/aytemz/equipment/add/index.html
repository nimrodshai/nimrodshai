<script>var DEMO_BASE="../../";</script>
<script>(function(){
  var MAP=[[/^\/checkout\/api\/equipment\/([0-9a-f]+)/,'api/equipment-$1.json'],[/^\/reservations\/api\/availability\/([0-9a-f]+)/,'api/availability-$1.json'],[/^\/clients\/api\/search/,'api/clients-search.json'],[/^\/reservations\/api\/events/,'api/reservations-events.json']];
  function note(){var t=document.getElementById('demo-toast');if(!t){t=document.createElement('div');t.id='demo-toast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 16px;border-radius:10px;font:500 14px system-ui;z-index:99999;box-shadow:0 8px 24px #0004;transition:opacity .3s';document.body.appendChild(t);}t.textContent='This is a demo with sample data, so changes are not saved.';t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity=0},2600);}
  window.demoNote=note;
  var _f=window.fetch;
  window.fetch=function(u,o){var s=String(u);var m=(o&&o.method||'GET').toUpperCase();
    if(m!=='GET'){note();return Promise.resolve(new Response(JSON.stringify({error:'Demo mode: changes are not saved.'}),{status:400,headers:{'Content-Type':'application/json'}}));}
    for(var i=0;i<MAP.length;i++){if(MAP[i][0].test(s.split('?')[0]))return _f(DEMO_BASE+s.split('?')[0].replace(MAP[i][0],MAP[i][1]));}
    return _f(u,o);};
  document.addEventListener('submit',function(e){var f=e.target;if((f.method||'get').toLowerCase()!=='get'||f.getAttribute('action')==='#'){e.preventDefault();note();}else{e.preventDefault();note();}},true);
  document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[data-demo-off]');if(a){e.preventDefault();note();}},true);
  document.addEventListener('DOMContentLoaded',function(){var b=document.createElement('div');b.style.cssText='position:fixed;bottom:14px;right:14px;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;padding:4px 10px;border-radius:999px;font:600 12px system-ui;z-index:99998';b.textContent='Demo · sample data';document.body.appendChild(b);});
})();
</script>

<script>
// Categories from server
const categories = [
    
    'Grip',
    
    'Audio',
    
    'Lenses',
    
    'Lighting',
    
    'Monitors',
    
    'Cameras',
    
];

const categorySearch = document.getElementById('categorySearch');
const categoryResults = document.getElementById('categoryResults');

categorySearch.addEventListener('focus', function() {
    showCategoryResults(this.value.trim().toLowerCase());
});

categorySearch.addEventListener('input', function() {
    showCategoryResults(this.value.trim().toLowerCase());
});

function showCategoryResults(query) {
    // Filter existing categories
    const filtered = categories.filter(cat =>
        !query || cat.toLowerCase().includes(query)
    );

    let html = '';

    // Show filtered categories
    if (filtered.length > 0) {
        html = filtered.map(cat => `
            <div class="dropdown-item" onclick="selectCategory('${cat.replace(/'/g, "\\'")}')">
                ${cat}
            </div>
        `).join('');
    }

    // If query doesn't match any category exactly, offer to create new
    if (query && !categories.some(c => c.toLowerCase() === query)) {
        html += `
            <div class="dropdown-item new-category" onclick="selectCategory('${query.replace(/'/g, "\\'")}')">
                <i class="bi bi-plus-lg me-2"></i>Create "${query}"
            </div>
        `;
    }

    if (!html) {
        html = '<div class="dropdown-item text-muted">Type to search or create a category</div>';
    }

    categoryResults.innerHTML = html;
    categoryResults.classList.add('show');
}

function selectCategory(category) {
    categorySearch.value = category;
    categoryResults.classList.remove('show');
}

// Hide dropdown on outside click
document.addEventListener('click', function(e) {
    if (!document.getElementById('categoryDropdown').contains(e.target)) {
        categoryResults.classList.remove('show');
    }
});

// Allow keyboard selection
categorySearch.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        categoryResults.classList.remove('show');
    }
});
</script>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            sidebar.classList.toggle('show');
            overlay.style.display = sidebar.classList.contains('show') ? 'block' : 'none';
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if (sidebar.classList.contains('show')) {
                sidebar.classList.remove('show');
                overlay.style.display = 'none';
            }
        }

        // Close sidebar on scroll
        window.addEventListener('scroll', closeSidebar);

        // Close sidebar on touch move (for mobile)
        document.addEventListener('touchmove', closeSidebar);
    </script>
