<script>var DEMO_BASE="../../";</script>
<script>(function(){
  var MAP=[[/^\/checkout\/api\/equipment\/([0-9a-f]+)/,'api/equipment-$1.json'],[/^\/reservations\/api\/availability\/([0-9a-f]+)/,'api/availability-$1.json'],[/^\/clients\/api\/search/,'api/clients-search.json'],[/^\/reservations\/api\/events/,'api/reservations-events.json']];
  function note(){var t=document.getElementById('demo-toast');if(!t){t=document.createElement('div');t.id='demo-toast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 16px;border-radius:10px;font:500 14px system-ui;z-index:99999;box-shadow:0 8px 24px #0004;transition:opacity .3s';document.body.appendChild(t);}t.textContent='This is a demo with sample data, so changes are not saved.';t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity=0},2600);}
  window.demoNote=note;
  var _f=window.fetch;
  window.fetch=function(u,o){var s=String(u);var m=(o&&o.method||'GET').toUpperCase();
    if(m!=='GET'){note();return Promise.resolve(new Response(JSON.stringify({error:'Demo mode: changes are not saved.'}),{status:400,headers:{'Content-Type':'application/json'}}));}
    for(var i=0;i<MAP.length;i++){if(MAP[i][0].test(s.split('?')[0]))return _f(DEMO_BASE+s.split('?')[0].replace(MAP[i][0],MAP[i][1]));}
    return _f(u,o);};
  document.addEventListener('submit',function(e){var f=e.target;if((f.method||'get').toLowerCase()!=='get'||f.getAttribute('action')==='#'){e.preventDefault();note();}else{e.preventDefault();note();}},true);
  document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[data-demo-off]');if(a){e.preventDefault();note();}},true);
  document.addEventListener('DOMContentLoaded',function(){var b=document.createElement('div');b.style.cssText='position:fixed;bottom:14px;right:14px;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;padding:4px 10px;border-radius:999px;font:600 12px system-ui;z-index:99998';b.textContent='Demo · sample data';document.body.appendChild(b);});
})();
</script>

<script>
// Equipment data from server
const equipmentList = [
    
    { id: '6ad86c49aaaa84dbca53c354', name: 'Sony FX6 Cinema Camera', category: 'Cameras', amount: 3, available: 2 },
    
    { id: '6ad86c49aaaa84dbca53c355', name: 'ARRI Alexa Mini LF', category: 'Cameras', amount: 1, available: 1 },
    
    { id: '6ad86c49aaaa84dbca53c356', name: 'Canon EOS C70', category: 'Cameras', amount: 2, available: 2 },
    
    { id: '6ad86c49aaaa84dbca53c357', name: 'Sigma Cine 24-70 T2.9', category: 'Lenses', amount: 2, available: 1 },
    
    { id: '6ad86c49aaaa84dbca53c358', name: 'Zeiss CP.3 Prime Set', category: 'Lenses', amount: 1, available: 1 },
    
    { id: '6ad86c49aaaa84dbca53c359', name: 'Canon CN-E 70-200', category: 'Lenses', amount: 1, available: 1 },
    
    { id: '6ad86c49aaaa84dbca53c35a', name: 'Aputure LS 600d Pro', category: 'Lighting', amount: 4, available: 2 },
    
    { id: '6ad86c49aaaa84dbca53c35b', name: 'Nanlite PavoTube II 30X', category: 'Lighting', amount: 8, available: 4 },
    
    { id: '6ad86c49aaaa84dbca53c35c', name: 'Astera Titan Tube Kit', category: 'Lighting', amount: 1, available: 1 },
    
    { id: '6ad86c49aaaa84dbca53c35d', name: 'Sennheiser MKH 416', category: 'Audio', amount: 4, available: 2 },
    
    { id: '6ad86c49aaaa84dbca53c35e', name: 'Sound Devices MixPre-6 II', category: 'Audio', amount: 2, available: 1 },
    
    { id: '6ad86c49aaaa84dbca53c35f', name: 'Sennheiser EW-DP Wireless Kit', category: 'Audio', amount: 3, available: 3 },
    
    { id: '6ad86c49aaaa84dbca53c360', name: 'DJI RS 4 Pro Gimbal', category: 'Grip', amount: 2, available: 2 },
    
    { id: '6ad86c49aaaa84dbca53c361', name: 'C-Stand 40&#34;', category: 'Grip', amount: 12, available: 11 },
    
    { id: '6ad86c49aaaa84dbca53c362', name: 'Atomos Ninja V+', category: 'Monitors', amount: 3, available: 1 },
    
    { id: '6ad86c49aaaa84dbca53c363', name: 'SmallHD Cine 7', category: 'Monitors', amount: 2, available: 2 },
    
];

// Pre-select equipment if provided
const preselectedEquipmentId = '6ad86c49aaaa84dbca53c356';

document.addEventListener('DOMContentLoaded', function() {
    // Set default due date to 7 days from now
    const dueDateInput = document.getElementById('due_date');
    if (!dueDateInput.value) {
        const now = new Date();
        now.setDate(now.getDate() + 7);
        now.setHours(17, 0, 0, 0);
        dueDateInput.value = now.toISOString().slice(0, 16);
    }

    // Pre-select equipment if provided
    if (preselectedEquipmentId) {
        const eq = equipmentList.find(e => e.id === preselectedEquipmentId);
        if (eq) {
            selectEquipment(eq.id, eq.name, eq.category, eq.available, eq.amount);
        }
    }

});

// ============ EQUIPMENT SEARCH ============
const equipmentSearch = document.getElementById('equipmentSearch');
const equipmentResults = document.getElementById('equipmentResults');

equipmentSearch.addEventListener('focus', function() {
    showEquipmentResults('');
});

equipmentSearch.addEventListener('input', function() {
    showEquipmentResults(this.value.trim().toLowerCase());
});

function showEquipmentResults(query) {
    const filtered = equipmentList.filter(eq =>
        !query ||
        eq.name.toLowerCase().includes(query) ||
        eq.category.toLowerCase().includes(query)
    );

    if (filtered.length === 0) {
        equipmentResults.innerHTML = '<div class="dropdown-item text-muted">No available equipment found</div>';
    } else {
        equipmentResults.innerHTML = filtered.map(eq => `
            <div class="dropdown-item" onclick="selectEquipment('${eq.id}', '${eq.name.replace(/'/g, "\\'")}', '${eq.category.replace(/'/g, "\\'")}', ${eq.available}, ${eq.amount})">
                <strong>${eq.name}</strong>
                <small>${eq.category} - ${eq.available} of ${eq.amount} available</small>
            </div>
        `).join('');
    }
    equipmentResults.classList.add('show');
}

function selectEquipment(id, name, category, available, amount) {
    document.getElementById('equipment_id').value = id;
    document.getElementById('selectedEquipmentName').textContent = `${name} (${category}) - ${available} available`;
    document.getElementById('selectedEquipment').style.display = 'block';
    document.getElementById('equipmentDropdown').style.display = 'none';
    document.getElementById('quantityGroup').style.display = 'block';
    document.getElementById('quantity').max = available;
    document.getElementById('quantity').value = '1';
    document.getElementById('quantityHelp').textContent = `${available} of ${amount} units available`;
    equipmentResults.classList.remove('show');
}

function clearEquipment() {
    document.getElementById('equipment_id').value = '';
    document.getElementById('selectedEquipment').style.display = 'none';
    document.getElementById('equipmentDropdown').style.display = 'block';
    document.getElementById('quantityGroup').style.display = 'none';
    document.getElementById('quantity').removeAttribute('max');
    document.getElementById('quantity').value = '1';
    document.getElementById('quantityHelp').textContent = '';
    equipmentSearch.value = '';
    equipmentSearch.focus();
}

// ============ CLIENT SEARCH ============
let allClients = [];
let clientSearchDebounce = null;
let clientSearchRequestId = 0;
const clientSearch = document.getElementById('clientSearch');
const clientResults = document.getElementById('clientResults');

async function fetchClientResults(query) {
    const requestId = ++clientSearchRequestId;
    try {
        const params = new URLSearchParams({ q: query || '' });
        const response = await fetch(`/clients/api/search?${params.toString()}`);
        const results = response.ok ? await response.json() : [];

        // Ignore stale responses if user typed again.
        if (requestId !== clientSearchRequestId) return;

        allClients = results;
        renderClientResults(results);
    } catch (e) {
        allClients = [];
        renderClientResults([]);
    }
}

clientSearch.addEventListener('focus', function() {
    queueClientSearch(this.value.trim());
});

clientSearch.addEventListener('input', function() {
    queueClientSearch(this.value.trim());
});

function queueClientSearch(query) {
    if (clientSearchDebounce) clearTimeout(clientSearchDebounce);
    clientSearchDebounce = setTimeout(() => {
        fetchClientResults(query);
    }, 120);
}

function renderClientResults(results) {
    if (results.length === 0) {
        clientResults.innerHTML = '<div class="dropdown-item text-muted">No clients found. Click "New" to add one.</div>';
    } else {
        clientResults.innerHTML = results.map(c => `
            <div class="dropdown-item" onclick="selectClient('${c.id}', '${c.display.replace(/'/g, "\\'")}')">
                <strong>${c.first_name} ${c.last_name}</strong>
                ${c.email ? `<small>${c.email}</small>` : ''}
                ${c.phone ? `<small>${c.phone}</small>` : ''}
            </div>
        `).join('');
    }
    clientResults.classList.add('show');
}

function selectClient(id, display) {
    document.getElementById('client_id').value = id;
    document.getElementById('selectedClientName').textContent = display;
    document.getElementById('selectedClient').style.display = 'block';
    document.getElementById('clientDropdown').style.display = 'none';
    clientResults.classList.remove('show');
}

function clearClient() {
    document.getElementById('client_id').value = '';
    document.getElementById('selectedClient').style.display = 'none';
    document.getElementById('clientDropdown').style.display = 'block';
    clientSearch.value = '';
    clientSearch.focus();
}

// ============ HIDE DROPDOWNS ON OUTSIDE CLICK ============
document.addEventListener('click', function(e) {
    if (!document.getElementById('equipmentDropdown').contains(e.target)) {
        equipmentResults.classList.remove('show');
    }
    if (!document.getElementById('clientDropdown').contains(e.target)) {
        clientResults.classList.remove('show');
    }
});

// ============ CREATE CLIENT ============
async function createClient() {
    const firstName = document.getElementById('newFirstName').value.trim();
    const lastName = document.getElementById('newLastName').value.trim();
    const email = document.getElementById('newEmail').value.trim();
    const phone = document.getElementById('newPhone').value.trim();
    const errorDiv = document.getElementById('newClientError');

    errorDiv.style.display = 'none';

    if (!firstName || !lastName) {
        errorDiv.textContent = 'First name and last name are required';
        errorDiv.style.display = 'block';
        return;
    }

    if (!email && !phone) {
        errorDiv.textContent = 'Either email or phone is required';
        errorDiv.style.display = 'block';
        return;
    }

    try {
        const response = await fetch('/clients/api/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ first_name: firstName, last_name: lastName, email, phone })
        });

        const data = await response.json();

        if (!response.ok) {
            errorDiv.textContent = data.error || 'Failed to create client';
            errorDiv.style.display = 'block';
            return;
        }

        // Add to local list and select
        allClients.unshift(data);
        selectClient(data.id, data.display);

        // Close modal and reset form
        bootstrap.Modal.getInstance(document.getElementById('newClientModal')).hide();
        document.getElementById('newFirstName').value = '';
        document.getElementById('newLastName').value = '';
        document.getElementById('newEmail').value = '';
        document.getElementById('newPhone').value = '';
    } catch (err) {
        errorDiv.textContent = 'Failed to create client';
        errorDiv.style.display = 'block';
    }
}

// ============ FORM VALIDATION ============
document.getElementById('checkoutForm').addEventListener('submit', function(e) {
    if (!document.getElementById('equipment_id').value) {
        e.preventDefault();
        alert('Please select equipment');
        equipmentSearch.focus();
        return;
    }
    const quantity = Number(document.getElementById('quantity').value);
    const maxQuantity = Number(document.getElementById('quantity').max);
    if (!quantity || quantity < 1 || quantity > maxQuantity) {
        e.preventDefault();
        alert(`Quantity must be between 1 and ${maxQuantity}`);
        document.getElementById('quantity').focus();
        return;
    }
    if (!document.getElementById('client_id').value) {
        e.preventDefault();
        alert('Please select or add a client');
        clientSearch.focus();
    }
});
</script>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            sidebar.classList.toggle('show');
            overlay.style.display = sidebar.classList.contains('show') ? 'block' : 'none';
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if (sidebar.classList.contains('show')) {
                sidebar.classList.remove('show');
                overlay.style.display = 'none';
            }
        }

        // Close sidebar on scroll
        window.addEventListener('scroll', closeSidebar);

        // Close sidebar on touch move (for mobile)
        document.addEventListener('touchmove', closeSidebar);
    </script>
